[project]
name = "card-generator"
version = "0.1.0"
description = "ИИ-генератор карточки товара: документы поставщиков, гибридный поиск, генерация со ссылками на источники, защита от инъекций"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.50",
    "openai-agents>=0.2,<1",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0",
    "structlog>=24.1",
    "temporalio>=1.14,<2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

# torch на Linux по умолчанию тянет сборку с CUDA (~2 ГБ); для эмбеддингов на процессоре
# достаточно CPU-сборки (~200 МБ). На Windows и macOS обычная сборка с PyPI и так CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
